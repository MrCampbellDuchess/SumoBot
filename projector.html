<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SumoBot Tournament — Projector Display</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="stylesheet" href="css/styles.css?v=1.2">
</head>
<body class="projector-body">
  <header class="proj-topbar">
    <div class="proj-brand">
      <div class="brand-badge">🤖</div>
      <div>SUMOBOT TOURNAMENT</div>
    </div>
    <div class="proj-subtitle" id="proj-subtitle">PERIOD 2 • DOUBLE ELIMINATION</div>
    <button class="btn btn-sm proj-fullscreen-btn" id="btn-fullscreen" title="Toggle Fullscreen (F11)">⛶ Fullscreen</button>
  </header>

  <div class="proj-ondeck" id="proj-ondeck" style="display:none"></div>

  <main class="proj-stage" id="proj-stage">
    <div class="empty-bracket">
      <div class="empty-icon">📺</div>
      <h3>Waiting for Teacher Control Panel...</h3>
      <p>Keep the Teacher window open to sync the tournament bracket and live matches automatically.</p>
    </div>
  </main>

  <script src="js/bracket-engine.js?v=1.2"></script>
  <script src="js/sync.js?v=1.2"></script>
  <script src="js/bracket-renderer.js?v=1.2"></script>
  <script src="js/projector.js?v=1.2"></script>
</body>
</html>
